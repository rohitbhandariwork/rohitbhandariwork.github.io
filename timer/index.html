<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pomodoro Timer — RBPN</title>
<meta name="description" content="Pomodoro timer with gamification. Focus, break, earn XP, build streaks.">
<link rel="canonical" href="https://rohitbhandariwork.github.io/timer/">
<meta property="og:title" content="Pomodoro Timer — RBPN">
<meta property="og:description" content="Pomodoro timer with gamification. Focus, break, earn XP, build streaks.">
<meta property="og:url" content="https://rohitbhandariwork.github.io/timer/">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,system-ui,sans-serif;background:#0f0f1a;color:#e8e8f0;line-height:1.6;overflow-x:hidden;min-height:100vh;-webkit-tap-highlight-color:transparent;padding-top:calc(52px + env(safe-area-inset-top,0));-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:#1a1a2e}
::-webkit-scrollbar-thumb{background:#3a3a5c;border-radius:3px}
#topbar{position:fixed;top:0;left:0;right:0;z-index:10000;background:rgba(15,15,26,0.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:4px;padding:max(env(safe-area-inset-top,0),4px) 8px;min-height:52px}
.hamburger{display:block;background:none;border:none;cursor:pointer;font-size:22px;color:#8888aa;padding:8px 10px;border-radius:8px;transition:.2s;touch-action:manipulation}
.hamburger:active{color:#fff;background:rgba(255,255,255,.08)}
.nav-links{display:none;position:fixed;top:52px;left:0;right:0;flex-direction:column;background:rgba(15,15,26,0.98);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.06);padding:6px 12px 12px;gap:4px;align-items:stretch;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.nav-links.open{display:flex}
.nav-links a{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 14px;border-radius:10px;font-size:14px;font-weight:600;color:#8888aa;text-decoration:none;transition:.2s;white-space:nowrap;touch-action:manipulation}
.nav-links a:active{color:#fff;background:rgba(255,255,255,.08)}
.nav-links a.active{color:#f59e0b;background:rgba(245,158,11,.12)}

/* Stats Hero */
.stats-hero{background:linear-gradient(135deg,#1a1a2e 0%,#2a1a3e 50%,#1a2e1a 100%);padding:12px 8px;position:relative;overflow:hidden}
.stats-grid{display:flex;align-items:center;gap:8px;max-width:100%;margin:0 auto}
.level-badge{position:relative;width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#1e1e3a,#2a2a5a);border:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.lvl-num{font-size:22px;font-weight:900;line-height:1;background:linear-gradient(135deg,#f59e0b,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.lvl-label{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#8888aa;margin-top:1px;-webkit-text-fill-color:#8888aa}
.stats-main{flex:1;min-width:0}
.stats-row1{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.stats-row1 .title{font-size:12px;font-weight:800;color:#f59e0b;white-space:nowrap}
.stats-row1 .xp-text{font-size:11px;font-weight:700;color:#aaaac8;white-space:nowrap}
.xp-bar-wrap{height:4px;background:rgba(255,255,255,.06);border-radius:4px;margin-top:4px;overflow:hidden}
.xp-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#f59e0b,#ec4899);transition:width .5s ease;width:0%}
.stats-right{display:flex;gap:4px;flex-shrink:0}
.stat-pill{display:flex;flex-direction:column;align-items:center;padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);min-width:44px;min-height:44px;justify-content:center}
.stat-pill .stat-num{font-size:14px;font-weight:800;line-height:1.2}
.stat-pill .stat-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:#aaaac8}
.stat-pill.streak .stat-num{color:#f97316}
.stat-pill.streak.has-streak{background:rgba(249,115,22,.1);border-color:rgba(249,115,22,.2);animation:streakGlow 2s ease-in-out infinite}
@keyframes streakGlow{0%,100%{box-shadow:none}50%{box-shadow:0 0 12px rgba(249,115,22,.2)}}
.stat-pill.pomodoros .stat-num{color:#ef4444}
.days-chips{display:flex;gap:2px;margin-top:3px}
.day-chip{width:24px;height:24px;border-radius:5px;background:rgba(255,255,255,.08);font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#777;transition:.3s}
.day-chip.done{background:#22c55e;color:#fff}
.day-chip.today{box-shadow:0 0 6px rgba(245,158,11,.4)}
.day-chip.missed{background:#ef4444;color:#fff}

/* Container */
.container{max-width:100%;margin:0 auto;padding:0 16px}

/* Timer Section */
.timer-section{padding:20px 0;display:flex;flex-direction:column;align-items:center;gap:12px}
.timer-ring-wrap{position:relative;width:260px;height:260px;touch-action:manipulation}
.timer-ring-svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer-ring-bg{fill:none;stroke:rgba(255,255,255,.06);stroke-width:6}
.timer-ring-progress{fill:none;stroke:#f59e0b;stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .5s ease,stroke .5s ease}
.timer-ring-progress.running{animation:ringPulse 2s ease-in-out infinite}
@keyframes ringPulse{0%,100%{opacity:1}50%{opacity:.7}}
.timer-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.timer-phase{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:#aaaac8}
.timer-phase.focus{color:#f59e0b}
.timer-phase.break{color:#22c55e}
.timer-display{font-size:52px;font-weight:800;letter-spacing:2px;font-variant-numeric:tabular-nums;line-height:1;color:#fff}
.timer-session{font-size:11px;font-weight:600;color:#8888aa}
.timer-session strong{color:#c8c8e0}
.timer-controls{display:flex;gap:8px;margin-top:4px}
.timer-btn{padding:12px 28px;border-radius:999px;border:none;font-size:15px;font-weight:700;cursor:pointer;transition:.2s;min-height:48px;touch-action:manipulation;display:flex;align-items:center;gap:6px}
.btn-start{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff}
.btn-start:hover{box-shadow:0 4px 20px rgba(245,158,11,.3)}
.btn-start:active{transform:scale(.97)}
.btn-pause{background:rgba(255,255,255,.08);color:#e8e8f0;border:1px solid rgba(255,255,255,.1)}
.btn-pause:hover{background:rgba(255,255,255,.12)}
.btn-pause:active{transform:scale(.97)}
.btn-reset{background:rgba(239,68,68,.12);color:#ef4444;border:1px solid rgba(239,68,68,.15)}
.btn-reset:hover{background:rgba(239,68,68,.2)}
.btn-reset:active{transform:scale(.97)}
.btn-start:disabled,.btn-pause:disabled,.btn-reset:disabled{opacity:.4;cursor:not-allowed;transform:none}

/* Session Log */
.session-log{margin:10px auto;width:100%;max-width:360px}
.session-log-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#8888aa;margin-bottom:6px;text-align:center}
.session-log-items{display:flex;gap:3px;justify-content:center;flex-wrap:wrap}
.session-dot{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;transition:.3s}
.session-dot.focus{background:rgba(245,158,11,.15);color:#f59e0b}
.session-dot.focus.done{background:#f59e0b;color:#fff}
.session-dot.break{background:rgba(34,197,94,.15);color:#22c55e}
.session-dot.break.done{background:#22c55e;color:#fff}

/* Settings */
.settings-toggle{font-size:12px;font-weight:600;color:#8888aa;cursor:pointer;padding:8px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.06);transition:.2s;touch-action:manipulation;background:rgba(255,255,255,.02)}
.settings-toggle:hover{color:#e8e8f0;border-color:rgba(255,255,255,.12)}
.settings-panel{margin:6px auto;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);display:none;max-width:360px;width:100%}
.settings-panel.open{display:block}
.settings-group{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.settings-group:last-child{margin-bottom:0}
.settings-label{font-size:11px;font-weight:600;color:#aaaac8;display:flex;justify-content:space-between;align-items:center}
.settings-label span{color:#e8e8f0;font-weight:700;font-variant-numeric:tabular-nums}
.settings-options{display:flex;gap:4px;flex-wrap:wrap}
.settings-opt{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:#8888aa;cursor:pointer;transition:.2s;touch-action:manipulation;min-height:36px}
.settings-opt:hover{background:rgba(255,255,255,.06);color:#e8e8f0}
.settings-opt.active{background:rgba(245,158,11,.15);border-color:#f59e0b;color:#f59e0b}

/* Sound/Visual toggles */
.toggle-row{display:flex;gap:8px;justify-content:center;margin-top:4px}
.toggle-btn{display:flex;align-items:center;gap:4px;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:#8888aa;font-size:11px;font-weight:600;cursor:pointer;transition:.2s;touch-action:manipulation;min-height:36px}
.toggle-btn:hover{background:rgba(255,255,255,.06)}
.toggle-btn.active{background:rgba(34,197,94,.12);border-color:#22c55e;color:#22c55e}

/* Flash Effect */
.flash-overlay{position:fixed;inset:0;pointer-events:none;z-index:9999;transition:opacity .3s;opacity:0}
.flash-overlay.show{opacity:1}
.flash-overlay.flash-focus{background:rgba(245,158,11,.08)}
.flash-overlay.flash-break{background:rgba(34,197,94,.08)}
.flash-overlay.flash-complete{background:rgba(236,72,153,.12)}

/* Confetti */
.confetti-container{position:fixed;inset:0;pointer-events:none;z-index:9998;overflow:hidden}
.confetti-piece{position:absolute;width:8px;height:8px;border-radius:2px;animation:confettiFall linear forwards}
@keyframes confettiFall{0%{transform:translateY(-10px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

/* Float XP */
.float-xp{position:fixed;font-weight:900;font-size:24px;pointer-events:none;z-index:10000;animation:floatUp 1.2s ease forwards;text-shadow:0 0 12px currentColor}
@keyframes floatUp{0%{transform:translateY(0) scale(.5);opacity:1}100%{transform:translateY(-120px) scale(1.2);opacity:0}}

/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:12px;font-size:13px;font-weight:700;z-index:9999;opacity:0;transition:opacity .3s ease,transform .3s ease;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.toast.success{background:rgba(34,197,94,.15);color:#22c55e;border:1px solid rgba(34,197,94,.2)}
.toast.xp{background:rgba(245,158,11,.15);color:#f59e0b;border:1px solid rgba(245,158,11,.2)}
.toast.info{background:rgba(59,130,246,.15);color:#3b82f6;border:1px solid rgba(59,130,246,.2)}
.toast.error{background:rgba(239,68,68,.15);color:#ef4444;border:1px solid rgba(239,68,68,.2)}
.toast.warning{background:rgba(168,85,247,.15);color:#a855f7;border:1px solid rgba(168,85,247,.2)}

/* Stats footer */
.stats-footer{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:4px}
.stats-footer span{font-size:11px;color:#aaaac8}
.stats-footer strong{color:#f59e0b}

/* Responsive */
@media(min-width:768px){
#topbar{padding:max(env(safe-area-inset-top,0),4px) 12px}
.hamburger{display:none}
.nav-links{display:flex;position:static;flex-direction:row;background:none;backdrop-filter:none;border-bottom:none;padding:0;gap:4px;align-items:center;justify-content:flex-end;box-shadow:none}
.nav-links a{padding:6px 12px;border-radius:999px;font-size:12px;justify-content:flex-start}
.stats-hero{padding:14px 20px}
.timer-ring-wrap{width:300px;height:300px}
.timer-display{font-size:64px}
}

@media(min-width:1024px){
.stats-hero{padding:24px 32px}
.level-badge{width:64px;height:64px}
.lvl-num{font-size:26px}
.stats-row1 .title{font-size:14px}
.stats-row1 .xp-text{font-size:13px}
.stat-pill{padding:8px 14px;min-width:48px}
.stat-pill .stat-num{font-size:18px}
.stat-pill .stat-label{font-size:12px}
.day-chip{width:28px;height:28px;font-size:11px}
.timer-ring-wrap{width:340px;height:340px}
.timer-display{font-size:72px}
.timer-phase{font-size:14px}
.timer-session{font-size:13px}
.timer-btn{padding:14px 36px;font-size:17px;min-height:52px}
.settings-panel{max-width:400px}
.settings-label{font-size:13px}
.settings-opt{font-size:13px;padding:8px 16px}
}
</style>
</head>
<body>

<div id="topbar">
<button class="hamburger" onclick="toggleNav()">☰</button>
<div class="nav-links" id="navLinks">

<circle class="timer-ring-bg" cx="50" cy="50" r="44"/>

</svg>

</div>

<button class="settings-opt" data-value="3">3</button>

<script>
// ── Audio ──
let audioCtx;
function getCtx(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx}
function tone(f,d,t,g){try{const c=getCtx(),o=c.createOscillator(),a=c.createGain();o.type=t||'sine';o.frequency.value=f;a.gain.setValueAtTime(g||.15,c.currentTime);a.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.connect(a);a.connect(c.destination);o.start();o.stop(c.currentTime+d)}catch(e){}}
function melody(notes){notes.forEach(n=>tone(n[0],n[2],n[3],n[4]))}
const SND={
  click:()=>tone(1200,.04,'sine',.04),
  start:()=>melody([[523.25,0,.1,'sine',.1],[659.25,.08,.1,'sine',.1],[783.99,.16,.15,'sine',.1]]),
  pause:()=>melody([[659.25,0,.08,'sine',.08],[523.25,.08,.12,'sine',.08]]),
  complete:()=>melody([[523.25,0,.1,'sine',.1],[659.25,.1,.1,'sine',.1],[783.99,.2,.1,'sine',.1],[1046.5,.3,.15,'sine',.12],[1318.51,.4,.2,'sine',.12],[1567.98,.5,.35,'sine',.1]]),
  breakStart:()=>melody([[587.33,0,.1,'sine',.08],[783.99,.08,.1,'sine',.08],[1046.5,.16,.15,'sine',.1]]),
  alarm:()=>{for(let i=0;i<3;i++)setTimeout(()=>tone(880,.15,'square',.12),i*250)},
  levelUp:()=>melody([[523.25,0,.1,'square',.06],[659.25,.1,.1,'square',.06],[783.99,.2,.1,'square',.06],[1046.5,.3,.3,'square',.06]]),
  xp:()=>melody([[659.25,0,.1,'sine',.08],[880,.08,.15,'sine',.08]]),
};

// ── Settings ──
let WORK_DUR=25, SHORT_BREAK=5, LONG_BREAK=15, SESSIONS_BEFORE_LONG=4;
const LS_KEY='timer_stats';

// ── State ──
let state={phase:'idle',mode:'focus',timeLeft:WORK_DUR*60,totalTime:WORK_DUR*60,session:1,totalSessions:SESSIONS_BEFORE_LONG,paused:false,timerId:null,wasLongBreak:false,fociDone:0};
let soundEnabled=true,visualEnabled=true;

// ── Gamification ──
function loadStats(){
  try{const d=JSON.parse(localStorage.getItem(LS_KEY));if(d&&typeof d==='object')return d}catch(e){}
  return {xp:0,level:1,pomodoros:0,streak:0,streak_days:[],best_streak:0,total_focus_minutes:0,sessions_today:0,last_date:''};
}
let stats=loadStats();

function saveStats(){
  try{localStorage.setItem(LS_KEY,JSON.stringify(stats))}catch(e){}
}

const TITLES=[
  {minLevel:1,title:'Timer Newbie'},
  {minLevel:2,title:'Focus Seeker'},
  {minLevel:4,title:'Pomodoro Pro'},
  {minLevel:7,title:'Time Warden'},
  {minLevel:10,title:'Chronomaster'},
  {minLevel:15,title:'Tempus Dominus'},
];

function getTitle(level){
  let t=TITLES[0].title;
  for(const ti of TITLES){if(level>=ti.minLevel)t=ti.title}
  return t;
}

function xpNeeded(level){return level*50}

function addXP(amount){
  stats.xp+=amount;
  while(stats.xp>=xpNeeded(stats.level)){
    stats.xp-=xpNeeded(stats.level);
    stats.level++;
    SND.levelUp();
    spawnConf(40);
    showToast('🎉 Level Up! You are now Level '+stats.level,'warning');
  }
  updateStatsUI();
  saveStats();
}

function updateStatsUI(){
  const l=stats.level,xpL=stats.xp,need=xpNeeded(l),pct=Math.min(100,(xpL/need)*100);
  document.getElementById('lvlNum').textContent=l;
  document.getElementById('xpDisplay').textContent=xpL+' / '+need+' XP';
  document.getElementById('xpBar').style.width=pct+'%';
  document.getElementById('rankTitle').textContent=getTitle(l);
  document.getElementById('pomodoroCount').textContent=stats.pomodoros;
  document.getElementById('streakNum').textContent=stats.streak;
  document.getElementById('streakPill').classList.toggle('has-streak',(stats.streak||0)>0);
  // Days chips
  const chips=document.getElementById('daysChips');chips.innerHTML='';
  const days=stats.streak_days||[],today=new Date().toISOString().slice(0,10);
  for(let i=6;i>=0;i--){const d=new Date(Date.now()-i*86400000),ds=d.toISOString().slice(0,10),c=document.createElement('div');c.className='day-chip';if(days.includes(ds))c.classList.add('done');if(ds===today&&days.includes(ds))c.classList.add('today');if(!days.includes(ds)&&ds<today)c.classList.add('missed');c.textContent=['S','M','T','W','T','F','S'][d.getDay()];chips.appendChild(c)}
}

// ── Streak ──
function updateStreak(){
  const today=new Date().toISOString().slice(0,10);
  const days=stats.streak_days||[];
  if(!days.includes(today)){
    days.push(today);
    stats.streak_days=days;
    // Check consecutive
    let streak=0;
    const d=new Date();
    while(true){
      const ds=d.toISOString().slice(0,10);
      if(days.includes(ds)){streak++;d.setDate(d.getDate()-1)}
      else break;
    }
    stats.streak=streak;
    if(streak>stats.best_streak)stats.best_streak=streak;
    saveStats();
    updateStatsUI();
  }
}

// ── Timer Logic ──
const CIRCUMFERENCE=2*Math.PI*44;

function updateRing(progress){
  const offset=CIRCUMFERENCE*(1-Math.min(1,Math.max(0,progress)));
  const ring=document.getElementById('timerRing');
  ring.style.strokeDashoffset=offset;
}

function formatTime(secs){
  const m=Math.floor(secs/60),s=secs%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

function updateDisplay(){
  document.getElementById('timerDisplay').textContent=formatTime(state.timeLeft);
  document.getElementById('sessionNum').textContent=state.session;
  document.getElementById('sessionTotal').textContent=state.totalSessions;
  const phase=document.getElementById('timerPhase');
  const ring=document.getElementById('timerRing');
  if(state.mode==='focus'){
    phase.textContent='FOCUS';
    phase.className='timer-phase focus';
    ring.style.stroke='#f59e0b';
  }else{
    phase.textContent='BREAK';
    phase.className='timer-phase break';
    ring.style.stroke='#22c55e';
  }
  updateRing(state.totalTime>0?state.timeLeft/state.totalTime:0);
}

function flashScreen(cls){
  if(!visualEnabled)return;
  const ov=document.getElementById('flashOverlay');
  ov.className='flash-overlay show '+cls;
  setTimeout(()=>ov.className='flash-overlay',500);
}

function spawnConfetti(count){
  if(!visualEnabled)return;
  const c=document.getElementById('confettiContainer');
  const colors=['#f59e0b','#ec4899','#22c55e','#3b82f6','#a855f7','#ef4444','#14b8a6'];
  for(let i=0;i<count;i++){
    const el=document.createElement('div');el.className='confetti-piece';
    el.style.left=Math.random()*100+'%';
    el.style.background=colors[Math.floor(Math.random()*colors.length)];
    el.style.width=(4+Math.random()*6)+'px';el.style.height=(4+Math.random()*6)+'px';
    el.style.borderRadius=Math.random()>.5?'50%':'2px';
    el.style.animationDuration=(1.5+Math.random()*1.5)+'s';
    el.style.animationDelay=Math.random()*.3+'s';
    c.appendChild(el);
    setTimeout(()=>el.remove(),3000);
  }
}

function spawnFloat(text,color){
  const el=document.createElement('div');el.className='float-xp';
  el.textContent=text;el.style.color=color||'#f59e0b';
  el.style.left=(20+Math.random()*60)+'%';el.style.top=(30+Math.random()*40)+'%';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1400);
}

let toastTimer;
function showToast(msg,type){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast show '+(type||'success');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.className='toast',2500);
}

function tick(){
  state.timeLeft--;
  updateDisplay();
  if(state.timeLeft<=0){
    clearInterval(state.timerId);state.timerId=null;
    state.paused=false;
    completePhase();
  }
}

function startTimer(){
  if(!state.paused&&state.phase==='idle'){
    // Reset from idle
    state.timeLeft=WORK_DUR*60;state.totalTime=WORK_DUR*60;
    state.mode='focus';state.session=1;
    state.totalSessions=SESSIONS_BEFORE_LONG;
  }
  if(state.timerId)return;
  if(state.timeLeft<=0){
    state.timeLeft=state.totalTime;
  }
  state.phase='running';state.paused=false;
  state.timerId=setInterval(tick,1000);
  document.getElementById('startBtn').style.display='none';
  document.getElementById('pauseBtn').style.display='flex';
  if(soundEnabled)SND.start();
  updateDisplay();
}

function pauseTimer(){
  if(state.timerId){
    clearInterval(state.timerId);state.timerId=null;
    state.paused=true;state.phase='paused';
    document.getElementById('pauseBtn').style.display='none';
    document.getElementById('startBtn').style.display='flex';
    document.getElementById('startBtn').textContent='▶ Resume';
    if(soundEnabled)SND.pause();
  }
}

function resetTimer(){
  if(state.timerId){clearInterval(state.timerId);state.timerId=null}
  state.phase='idle';state.paused=false;
  state.mode='focus';state.session=1;state.fociDone=0;
  state.totalSessions=SESSIONS_BEFORE_LONG;
  state.timeLeft=WORK_DUR*60;state.totalTime=WORK_DUR*60;
  document.getElementById('startBtn').style.display='flex';
  document.getElementById('startBtn').textContent='▶ Start';
  document.getElementById('pauseBtn').style.display='none';
  updateDisplay();
  updateSessionLog();
  document.getElementById('timerRing').classList.remove('running');
}

function completePhase(){
  if(state.mode==='focus'){
    stats.pomodoros++;stats.total_focus_minutes+=Math.round(WORK_DUR);
    const today=new Date().toISOString().slice(0,10);
    if(stats.last_date!==today){stats.last_date=today;stats.sessions_today=1}
    else stats.sessions_today++;
    state.fociDone++;
    addXP(10);
    updateStreak();
    flashScreen('flash-complete');
    spawnConfetti(40);
    spawnFloat('+10 XP','#f59e0b');
    if(soundEnabled){SND.complete();setTimeout(()=>SND.alarm(),800)}
    showToast('🍅 Focus complete! +10 XP','success');
    if(state.session>=state.totalSessions){
      state.wasLongBreak=true; state.mode='break'; state.session=1;
      state.timeLeft=LONG_BREAK*60; state.totalTime=LONG_BREAK*60;
      showToast('☕ Long break! '+LONG_BREAK+' min','info');
    }else{
      state.wasLongBreak=false; state.mode='break';
      state.timeLeft=SHORT_BREAK*60; state.totalTime=SHORT_BREAK*60;
      showToast('☕ Short break! '+SHORT_BREAK+' min','info');
    }
    flashScreen('flash-break');
    if(soundEnabled)SND.breakStart();
    updateDisplay();
    state.phase='idle';state.paused=false;
    document.getElementById('startBtn').textContent='▶ Start Break';
    document.getElementById('startBtn').style.display='flex';
    document.getElementById('pauseBtn').style.display='none';
    updateSessionLog();
  }else{
    addXP(5);
    spawnFloat('+5 XP','#22c55e');
    flashScreen('flash-focus');
    if(soundEnabled){SND.complete();setTimeout(()=>SND.alarm(),500)}
    showToast('✨ Break over! Time to focus','warning');
    if(state.wasLongBreak){
      state.wasLongBreak=false; state.fociDone=0;
    }else{
      state.session++;
    }
    state.mode='focus';state.timeLeft=WORK_DUR*60;state.totalTime=WORK_DUR*60;
    state.phase='idle';state.paused=false;
    document.getElementById('startBtn').textContent='▶ Start Focus';
    document.getElementById('startBtn').style.display='flex';
    document.getElementById('pauseBtn').style.display='none';
    updateDisplay();
    updateSessionLog();
  }
  saveStats();
  updateStatsUI();
}

// ── Session Log ──
function updateSessionLog(){
  const container=document.getElementById('sessionLogItems');
  container.innerHTML='';
  const total=state.totalSessions, done=state.fociDone, cur=state.session;
  const inBreak=state.mode==='break';
  for(let i=1;i<=total;i++){
    const dot=document.createElement('div');
    const isDone=i<=done;
    const isCur=i===cur&&!isDone;
    dot.className='session-dot focus'+(isDone?' done':'');
    dot.textContent=isDone?'🍅':(isCur?(inBreak?'☕':'⏳'):i);
    container.appendChild(dot);
  }
}
updateSessionLog();

// ── Settings ──
function toggleSettings(){
  document.getElementById('settingsPanel').classList.toggle('open');
}

function setupSettings(){
  document.querySelectorAll('.settings-options').forEach(group=>{
    group.querySelectorAll('.settings-opt').forEach(btn=>{
      btn.addEventListener('click',()=>{
        group.querySelectorAll('.settings-opt').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        const val=parseInt(btn.dataset.value);
        const id=group.id;
        if(id==='workOptions'){WORK_DUR=val;document.getElementById('workDurDisplay').textContent=val;if(state.phase==='idle'){state.timeLeft=WORK_DUR*60;state.totalTime=WORK_DUR*60;updateDisplay()}}
        else if(id==='shortBreakOptions'){SHORT_BREAK=val;document.getElementById('shortBreakDisplay').textContent=val}
        else if(id==='longBreakOptions'){LONG_BREAK=val;document.getElementById('longBreakDisplay').textContent=val}
        else if(id==='sessionsOptions'){SESSIONS_BEFORE_LONG=val;document.getElementById('sessionsDisplay').textContent=val;state.totalSessions=val;updateDisplay()}
        if(soundEnabled)SND.click();
      });
    });
  });
}
setupSettings();

// ── Toggles ──
function toggleSound(){
  soundEnabled=!soundEnabled;
  document.getElementById('soundToggle').classList.toggle('active');
  document.getElementById('soundToggle').textContent=soundEnabled?'🔊 Sound':'🔇 Mute';
  if(soundEnabled)SND.click();
}
function toggleVisual(){
  visualEnabled=!visualEnabled;
  document.getElementById('visualToggle').classList.toggle('active');
  document.getElementById('visualToggle').textContent=visualEnabled?'✨ Effects':'🚫 No FX';
  if(soundEnabled)SND.click();
}

// ── Nav ──
function toggleNav(){document.getElementById('navLinks').classList.toggle('open')}

// ── Init ──
document.addEventListener('click',()=>{if(!audioCtx)getCtx()},{once:true});
updateStatsUI();
resetTimer();
updateSessionLog();
</script>
