hor="end" font-size="15.5" font-weight="700" fill="#334155" font-family="Manrope, Inter, -apple-system, 'Segoe UI', sans-serif">deploy, config, load</text><text x="450" y="914" text-anchor="middle" font-size="13" font-weight="500" fill="#94a3b8">assume logs don't survive. copy them out.</text></svg>