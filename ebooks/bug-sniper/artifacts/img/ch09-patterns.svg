="14.5" font-weight="700" fill="#0f172a" font-family="Manrope, Inter, -apple-system, 'Segoe UI', sans-serif">Bulkhead</text><text x="480" y="341" text-anchor="middle" font-size="13.5" font-weight="500" fill="#334155" font-family="Manrope, Inter, -apple-system, 'Segoe UI', sans-serif">one tenant starving the fleet</text><text x="773.3333333333333" y="341" text-anchor="middle" font-size="13.5" font-weight="500" fill="#334155" font-family="Manrope, Inter, -apple-system, 'Segoe UI', sans-serif">partitioning capacity</text><rect x="40" y="366" width="880" height="40" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="186.66666666666666" y="387" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a" font-family="Manrope, Inter, -apple-system, 'Segoe UI', sans-serif">Backpressure</text><text x="480" y="387" text-anchor="middle" font-size="13.5" font-weight="500" fill="#334155" font-family="Manrope, Inter, -apple-system, 'Segoe UI', sans-serif">influx overwhelming a service</text><text x="773.3333333333333" y="387" text-anchor="middle" font-size="13.5" font-weight="500" fill="#334155" font-family="Manrope, Inter, -apple-system, 'Segoe UI', sans-serif">rejecting when full</text><rect x="40" y="412" width="880" height="40" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/><text x="186.66666666666666" y="433" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a" font-family="Manrope, Inter, -apple-system, 'Segoe UI', sans-serif">Fail fast</text><text x="480" y="433" text-anchor="middle" font-size="13.5" font-weight="500" fill="#334155" font-family="Manrope, Inter, -apple-system, 'Segoe UI', sans-serif">glacial timeouts pass the pain on</text><text x="773.3333333333333" y="433" text-anchor="middle" font-size="13.5" font-weight="500" fill="#334155" font-family="Manrope, Inter, -apple-system, 'Segoe UI', sans-serif">dropping instead of stalling</text></svg>