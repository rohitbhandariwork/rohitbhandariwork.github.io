<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" font-family="Manrope, Inter, -apple-system, 'Segoe UI', sans-serif">
<defs>
  <linearGradient id="fm-navigator-grad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#667eea"/><stop offset="100%" stop-color="#764ba2"/>
  </linearGradient>
  <linearGradient id="fm-navigator-warm" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#ef4444"/>
  </linearGradient>
  <linearGradient id="fm-navigator-go" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#06b6d4"/>
  </linearGradient>
</defs>
<rect x="410" y="40" width="300" height="84" rx="22" fill="url(#fm-navigator-grad)" filter="drop-shadow(0 10px 16px rgba(102,126,234,.35))"/>
<text x="560" y="90" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">What's your situation right now?</text>
<text x="560" y="114" text-anchor="middle" font-size="14" font-weight="500" fill="rgba(255,255,255,.85)">start where the pain is</text><path d="M 560 124 C 560 100, 185 100, 185 124" fill="none" stroke="#818cf8" stroke-width="3" marker-end="url(#fm-navigator-arr)"/><rect x="60" y="130" width="250" height="124" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="drop-shadow(0 6px 10px rgba(15,23,42,.06))"/><rect x="60" y="146" width="226" height="34" rx="10" fill="#64748b" opacity=".92"/>
<text x="73" y="168" font-size="13" font-weight="800" fill="#ffffff">ONCALL</text><text x="76" y="212" font-size="14" font-weight="800" fill="#0f172a">I'm the one losing sleep</text><text x="76" y="236" font-size="12.5" font-weight="500" fill="#64748b">Ch 1–5, 13. The loop, first.</text><path d="M 560 124 C 560 100, 518.3333333333333 100, 518.3333333333333 124" fill="none" stroke="#818cf8" stroke-width="3" marker-end="url(#fm-navigator-arr)"/><rect x="393.3333333333333" y="130" width="250" height="124" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="drop-shadow(0 6px 10px rgba(15,23,42,.06))"/><rect x="393.3333333333333" y="146" width="208.28" height="34" rx="10" fill="#64748b" opacity=".92"/>
<text x="406.3333333333333" y="168" font-size="13" font-weight="800" fill="#ffffff">OBSERVE</text><text x="409.3333333333333" y="212" font-size="16" font-weight="800" fill="#0f172a">I can't see my system</text><text x="409.3333333333333" y="236" font-size="11.5" font-weight="500" fill="#64748b">Ch 6–8. Senses, SLOs, alerts.</text><path d="M 560 124 C 560 100, 851.6666666666666 100, 851.6666666666666 124" fill="none" stroke="#818cf8" stroke-width="3" marker-end="url(#fm-navigator-arr)"/><rect x="726.6666666666666" y="130" width="250" height="124" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="drop-shadow(0 6px 10px rgba(15,23,42,.06))"/><rect x="726.6666666666666" y="146" width="190.92" height="34" rx="10" fill="#64748b" opacity=".92"/>
<text x="739.6666666666666" y="168" font-size="13" font-weight="800" fill="#ffffff">HARDEN</text><text x="742.6666666666666" y="212" font-size="18" font-weight="800" fill="#0f172a">It survives, barely</text><text x="742.6666666666666" y="236" font-size="12.5" font-weight="500" fill="#64748b">Ch 9–11. Patterns + failure.</text><path d="M 560 124 C 560 100, 1185 100, 1185 124" fill="none" stroke="#818cf8" stroke-width="3" marker-end="url(#fm-navigator-arr)"/><rect x="1060" y="130" width="250" height="124" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="drop-shadow(0 6px 10px rgba(15,23,42,.06))"/><rect x="1060" y="146" width="164.88" height="34" rx="10" fill="#64748b" opacity=".92"/>
<text x="1073" y="168" font-size="13" font-weight="800" fill="#ffffff">SHIP</text><text x="1076" y="212" font-size="18" font-weight="800" fill="#0f172a">Deploys scare me</text><text x="1076" y="236" font-size="12.5" font-weight="500" fill="#64748b">Ch 12, 13. Defend the pipe.</text><defs><marker id="fm-navigator-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#818cf8"/></marker></defs></svg>