<text x="73" y="168" font-size="13" font-weight="800" fill="#ffffff">WHAT</text><text x="76" y="212" font-size="18" font-weight="800" fill="#0f172a">Something's wrong</text><text x="76" y="236" font-size="10.5" font-weight="500" fill="#64748b">metrics — latency / errors first</text><path d="M 560 124 C 560 100, 518.3333333333333 100, 518.3333333333333 124" fill="none" stroke="#818cf8" stroke-width="3" marker-end="url(#ch06-which-arr)"/><rect x="393.3333333333333" y="130" width="250" height="124" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="drop-shadow(0 6px 10px rgba(15,23,42,.06))"/><rect x="393.3333333333333" y="146" width="156.20000000000002" height="34" rx="10" fill="#64748b" opacity=".92"/>
