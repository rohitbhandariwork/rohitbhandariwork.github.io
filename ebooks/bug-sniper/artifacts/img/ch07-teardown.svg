<text x="560" y="90" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">Teardown each alert: does it pass?</text>
<text x="560" y="114" text-anchor="middle" font-size="14" font-weight="500" fill="rgba(255,255,255,.85)">if it fails three gates, silence it</text><path d="M 560 124 C 560 100, 215 100, 215 124" fill="none" stroke="#818cf8" stroke-width="3" marker-end="url(#ch07-teardown-arr)"/><rect x="60" y="130" width="310" height="124" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="drop-shadow(0 6px 10px rgba(15,23,42,.06))"/><rect x="60" y="146" width="121.48" height="34" rx="10" fill="#64748b" opacity=".92"/>
<text x="73" y="168" font-size="13" font-weight="800" fill="#ffffff">ACT</text><text x="76" y="212" font-size="18" font-weight="800" fill="#0f172a">Actionable?</text><text x="76" y="236" font-size="13.5" font-weight="500" fill="#64748b">a human can act on it, now</text><path d="M 560 124 C 560 100, 715 100, 715 124" fill="none" stroke="#818cf8" stroke-width="3" marker-end="url(#ch07-teardown-arr)"/><rect x="560" y="130" width="310" height="124" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="drop-shadow(0 6px 10px rgba(15,23,42,.06))"/><rect x="560" y="146" width="86.75999999999999" height="34" rx="10" fill="#64748b" opacity=".92"/>
<text x="573" y="168" font-size="13" font-weight="800" fill="#ffffff">URGENT?</text><text x="576" y="212" font-size="18" font-weight="800" fill="#0f172a">Urgent?</text><text x="576" y="236" font-size="12.5" font-weight="500" fill="#64748b">fails now = paging, else dashboard</text><path d="M 560 124 C 560 100, 1215 100, 1215 124" fill="none" stroke="#818cf8" stroke-width="3" marker-end="url(#ch07-teardown-arr)"/><rect x="1060" y="130" width="310" height="124" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="drop-shadow(0 6px 10px rgba(15,23,42,.06))"/><rect x="1060" y="146" width="78.08" height="34" rx="10" fill="#64748b" opacity=".92"/>
<text x="1073" y="168" font-size="13" font-weight="800" fill="#ffffff">OWNED</text><text x="1076" y="212" font-size="18" font-weight="800" fill="#0f172a">Owned?</text><text x="1076" y="236" font-size="13.5" font-weight="500" fill="#64748b">one team answers for it</text><defs><marker id="ch07-teardown-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#818cf8"/></marker></defs></svg>