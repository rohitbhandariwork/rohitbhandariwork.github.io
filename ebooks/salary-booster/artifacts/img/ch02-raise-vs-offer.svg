</defs><rect x="30" y="150" width="470" height="294" rx="24" fill="#eef2ff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="30" y="150" width="470" height="54" rx="24" fill="url(#ch02-raise-vs-offer-grad)" opacity=".95"/><text x="265" y="172" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">A raise — capped</text><text x="265" y="190" text-anchor="middle" font-size="12.5" font-weight="500" fill="rgba(255,255,255,.85)">inside the same role</text><circle cx="58" cy="244" r="7" fill="url(#ch02-raise-vs-offer-grad)"/><text x="78" y="249" font-size="15" font-weight="600" fill="#0f172a">Bound to your current band</text><circle cx="58" cy="310" r="7" fill="url(#ch02-raise-vs-offer-grad)"/><text x="78" y="315" font-size="15" font-weight="600" fill="#0f172a">Review cycle timing</text><circle cx="58" cy="376" r="7" fill="url(#ch02-raise-vs-offer-grad)"/><text x="78" y="381" font-size="15" font-weight="600" fill="#0f172a">Incremental, budget-capped</text><circle cx="58" cy="442" r="7" fill="url(#ch02-raise-vs-offer-grad)"/><text x="78" y="447" font-size="15" font-weight="600" fill="#0f172a">Hard to make big jumps</text><rect x="630" y="150" width="470" height="294" rx="24" fill="#f5f3ff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="630" y="150" width="470" height="54" rx="24" fill="url(#ch02-raise-vs-offer-grad)" opacity=".95"/><text x="865" y="172" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">An offer — uncapped</text><text x="865" y="190" text-anchor="middle" font-size="12.5" font-weight="500" fill="rgba(255,255,255,.85)">new market price</text><circle cx="658" cy="244" r="7" fill="url(#ch02-raise-vs-offer-grad)"/><text x="678" y="249" font-size="15" font-weight="600" fill="#0f172a">Priced to the market band</text><circle cx="658" cy="310" r="7" fill="url(#ch02-raise-vs-offer-grad)"/><text x="678" y="315" font-size="15" font-weight="600" fill="#0f172a">Your timing</text><circle cx="658" cy="376" r="7" fill="url(#ch02-raise-vs-offer-grad)"/><text x="678" y="381" font-size="15" font-weight="600" fill="#0f172a">Negotiable up and down</text><circle cx="658" cy="442" r="7" fill="url(#ch02-raise-vs-offer-grad)"/><text x="678" y="447" font-size="15" font-weight="600" fill="#0f172a">Big jumps are normal</text><circle cx="570" cy="300" r="44" fill="url(#ch02-raise-vs-offer-warm)"/>
