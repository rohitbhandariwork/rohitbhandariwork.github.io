  <linearGradient id="ch10-defense-grad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#667eea"/><stop offset="100%" stop-color="#764ba2"/>
  </linearGradient>
  <linearGradient id="ch10-defense-warm" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#ef4444"/>
  </linearGradient>
  <linearGradient id="ch10-defense-go" x1="0" y1="0" x2="1" y2="1">
