<rect x="410" y="40" width="300" height="84" rx="22" fill="url(#ch02-negotiable-grad)" filter="drop-shadow(0 10px 16px rgba(102,126,234,.35))"/>
<text x="560" y="90" text-anchor="middle" font-size="19" font-weight="800" fill="#ffffff">Which parts can move?</text>
<text x="560" y="114" text-anchor="middle" font-size="14" font-weight="500" fill="rgba(255,255,255,.85)">when and if you ask</text><path d="M 560 124 C 560 100, 215 100, 215 124" fill="none" stroke="#818cf8" stroke-width="3" marker-end="url(#ch02-negotiable-arr)"/><rect x="60" y="130" width="310" height="124" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="drop-shadow(0 6px 10px rgba(15,23,42,.06))"/><rect x="60" y="146" width="286" height="34" rx="10" fill="#64748b" opacity=".92"/>
<text x="73" y="168" font-size="13" font-weight="800" fill="#ffffff">MOVES</text><text x="76" y="212" font-size="12" font-weight="800" fill="#0f172a">offer size · equity · joining bonus</text><text x="76" y="236" font-size="13.5" font-weight="500" fill="#64748b">negotiable at offer time</text><path d="M 560 124 C 560 100, 715 100, 715 124" fill="none" stroke="#818cf8" stroke-width="3" marker-end="url(#ch02-negotiable-arr)"/><rect x="560" y="130" width="310" height="124" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="drop-shadow(0 6px 10px rgba(15,23,42,.06))"/><rect x="560" y="146" width="286" height="34" rx="10" fill="#64748b" opacity=".92"/>
<text x="573" y="168" font-size="13" font-weight="800" fill="#ffffff">SLOW</text><text x="576" y="212" font-size="12" font-weight="800" fill="#0f172a">base inside the band · review cycle</text><text x="576" y="236" font-size="13.5" font-weight="500" fill="#64748b">semi-fixed, time-bound</text><path d="M 560 124 C 560 100, 1215 100, 1215 124" fill="none" stroke="#818cf8" stroke-width="3" marker-end="url(#ch02-negotiable-arr)"/><rect x="1060" y="130" width="310" height="124" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="drop-shadow(0 6px 10px rgba(15,23,42,.06))"/><rect x="1060" y="146" width="260.36" height="34" rx="10" fill="#64748b" opacity=".92"/>
<text x="1073" y="168" font-size="13" font-weight="800" fill="#ffffff">LOCKED</text><text x="1076" y="212" font-size="16" font-weight="800" fill="#0f172a">the band itself, this cycle</text><text x="1076" y="236" font-size="13.5" font-weight="500" fill="#64748b">fight the right hill</text><defs><marker id="ch02-negotiable-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#818cf8"/></marker></defs></svg>