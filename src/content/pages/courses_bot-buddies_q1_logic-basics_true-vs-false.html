    <h1>True vs. False</h1>

  </div>

  <div class="gamification-bar">
    <div class="gf-level" id="gf-level">Lv.1</div>
    <div class="gf-xp-wrap">

      <button class="answer-btn true" onclick="checkAnswer(true)">
