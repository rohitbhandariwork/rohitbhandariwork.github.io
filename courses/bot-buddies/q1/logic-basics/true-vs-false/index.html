<html lang="en">

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>True vs. False — Bot Buddies</title>

<style>
:root {
      --color: #f472b6;
      --color2: #fbbf24;
      --bg: #fdf2f8;
      --error: #ef4444;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    

    
/* ── Layout ── */
    .main { max-width: 720px; margin: 0 auto; padding: 24px 20px 60px; }

    /* ── Hero ── */
    .hero {
      background: linear-gradient(135deg, var(--color), var(--color2));
      border-radius: 24px; padding: 48px 24px; text-align: center; color: #fff;
      margin-bottom: 32px; position: relative; overflow: hidden;
    }
    .hero::before { content: ''; position: absolute; top: -50%; right: -30%; width: 300px; height: 300px; background: rgba(255,255,255,.08); border-radius: 50%; }
    .hero-emoji { font-size: 80px; margin-bottom: 16px; position: relative; }
    .hero h1 { font-size: clamp(28px, 5vw, 40px); font-weight: 800; letter-spacing: -.02em; position: relative; }
    .hero .tagline { display: inline-block; margin-top: 8px; padding: 6px 16px; background: rgba(255,255,255,.15); border-radius: 999px; font-size: 13px; font-weight: 700; backdrop-filter: blur(8px); position: relative; }

    /* ── Gamification Bar ── */
    .gamification-bar { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--border-light); border-radius: 12px; padding: 12px 16px; margin-bottom: 24px; }
    .gf-item { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--text); white-space: nowrap; }
    .gf-icon { font-size: 16px; }
    .gf-xp-wrap { flex: 1; min-width: 80px; }
    .gf-xp-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-secondary); margin-bottom: 4px; }
    .gf-xp-bar { background: var(--border-light); border-radius: 999px; height: 8px; overflow: hidden; }
    .gf-xp-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--color), var(--color2)); transition: width .5s ease; width: 0%; }
    .gf-level { background: linear-gradient(135deg, var(--color), var(--color2)); border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 800; color: #fff; }

    /* ── Game Container ── */
    .game-card {
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .question-emoji { font-size: 80px; text-align: center; margin: 20px 0; }
    .question-text { 
      font-size: 24px; font-weight: 800; text-align: center; 
      color: var(--text); margin-bottom: 32px;
      font-family: var(--font);
    }
    .answer-buttons { display: flex; gap: 16px; justify-content: center; }
    .answer-btn {
      flex: 1; max-width: 160px; padding: 20px; border-radius: 16px;
      border: none; cursor: pointer; transition: .2s;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .answer-btn:hover { transform: scale(1.02); }
    .answer-btn:active { transform: scale(0.98); }
    .answer-btn.true { background: var(--success); color: #fff; }
    .answer-btn.false { background: var(--error); color: #fff; }
    .answer-emoji { font-size: 36px; }
    .answer-label { font-size: 16px; font-weight: 700; font-family: var(--font); }

    /* ── Feedback ── */
    .feedback {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
      padding: 16px 32px; border-radius: 16px; font-size: 18px; font-weight: 700;
      font-family: var(--font); z-index: 99999; transition: transform .3s ease;
      pointer-events: none;
    }
    .feedback.show { transform: translateX(-50%) translateY(0); }
    .feedback.correct { background: var(--success); color: #fff; }
    .feedback.incorrect { background: var(--error); color: #fff; }

    /* ── Progress ── */
    .progress-dots { display: flex; justify-content: center; gap: 8px; margin-bottom: 24px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--border-light); transition: .2s; }
    .dot.active { background: var(--color); transform: scale(1.2); }
    .dot.complete { background: var(--success); }

    /* ── Complete Screen ── */
    .complete-screen { text-align: center; padding: 40px 20px; }
    .complete-emoji { font-size: 80px; margin-bottom: 16px; }
    .complete-title { font-size: 28px; font-weight: 800; color: var(--text); margin-bottom: 8px; }
    .complete-score { font-size: 18px; color: var(--text-secondary); margin-bottom: 24px; }
    .complete-buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>

<div id="topbar">
  <button class="hamburger" onclick="toggleNav()">☰</button>
  <div class="nav-links" id="navLinks">
    <a href="../../../../courses/bot-buddies/">← Course</a>
    <a href="../../../../news/">News</a>
  </div>
</div>

<div class="main">
  <div class="hero">
    <div class="hero-emoji">✅❌</div>
    <h1>True vs. False</h1>
    <div class="tagline">Logic Basics — Q1</div>
  </div>

  <div class="gamification-bar">
    <div class="gf-level" id="gf-level">Lv.1</div>
    <div class="gf-xp-wrap">
      <div class="gf-xp-label" id="gf-xp-text">0 XP</div>
      <div class="gf-xp-bar"><div class="gf-xp-fill" id="gf-xp-fill"></div></div>
    </div>
    <div class="gf-item"><span class="gf-icon">🔥</span><span id="gf-streak">0</span></div>
    <div class="gf-item"><span class="gf-icon">💎</span><span id="gf-gems">0</span></div>
  </div>

  <div class="progress-dots" id="progress-dots"></div>

  <div class="game-card" id="game-card">
    <div class="question-emoji" id="question-emoji">☀️</div>
    <div class="question-text" id="question-text">Is the sun hot?</div>
    <div class="answer-buttons">
      <button class="answer-btn true" onclick="checkAnswer(true)">
        <span class="answer-emoji">✅</span>
        <span class="answer-label">True</span>
      </button>
      <button class="answer-btn false" onclick="checkAnswer(false)">
        <span class="answer-emoji">❌</span>
        <span class="answer-label">False</span>
      </button>
    </div>
  </div>

  <div class="complete-screen" id="complete-screen" style="display:none">
    <div class="complete-emoji">🏆</div>
    <div class="complete-title">Great Job!</div>
    <div class="complete-score" id="complete-score">You earned 80 XP!</div>
    <div class="complete-buttons">
      <a href="true-vs-false/" class="btn-primary btn-lg">Play Again</a>
      <a href="../yes-or-no/" class="btn-secondary btn-lg">Next: Yes or No →</a>
      <a href="../../../../courses/bot-buddies/" class="btn-gray btn-md">← Back to Course</a>
    </div>
  </div>
</div>

<div class="feedback" id="feedback"></div>

<script>
function toggleNav(){document.getElementById('navLinks').classList.toggle('open')}

const QUESTIONS = [
  { emoji: '☀️', text: 'The sun is hot', answer: true },
  { emoji: '🧊', text: 'Ice is cold', answer: true },
  { emoji: '🐟', text: 'Fish can fly', answer: false },
  { emoji: '🐦', text: 'Birds have wings', answer: true },
  { emoji: '🌙', text: 'The moon is made of cheese', answer: false },
  { emoji: '🐱', text: 'Cats bark', answer: false },
  { emoji: '💧', text: 'Water is wet', answer: true },
  { emoji: '🐶', text: 'Dogs can fly', answer: false }
];

let currentQ = 0;
let score = 0;
let streak = 0;

// Load state
function loadState() {
  try { return JSON.parse(localStorage.getItem('true-vs-false')) || { done: 0, streak: 0 }; }
  catch(e) { return { done: 0, streak: 0 }; }
}
function saveState(s) { localStorage.setItem('true-vs-false', JSON.stringify(s)); }
const state = loadState();

function updateUI() {
  const xp = score;
  const level = Math.floor(xp / 80) + 1;
  const xpInLevel = xp % 80;
  document.getElementById('gf-xp-fill').style.width = xpInLevel + '%';
  document.getElementById('gf-xp-text').textContent = xp + ' XP';
  document.getElementById('gf-level').textContent = 'Lv.' + level;
  document.getElementById('gf-streak').textContent = streak;
  document.getElementById('gf-gems').textContent = score / 10;
}

function showProgress() {
  const dots = document.getElementById('progress-dots');
  dots.innerHTML = '';
  QUESTIONS.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = 'dot' + (i < currentQ ? ' complete' : '') + (i === currentQ ? ' active' : '');
    dots.appendChild(dot);
  });
}

function showQuestion() {
  if (currentQ >= QUESTIONS.length) {
    showComplete();
    return;
  }
  const q = QUESTIONS[currentQ];
  document.getElementById('question-emoji').textContent = q.emoji;
  document.getElementById('question-text').textContent = q.text;
  document.getElementById('game-card').style.display = 'block';
  document.getElementById('complete-screen').style.display = 'none';
  showProgress();
}

function checkAnswer(answer) {
  const q = QUESTIONS[currentQ];
  const correct = answer === q.answer;
  
  if (correct) {
    score += 10;
    streak++;
    showFeedback('🎉 Correct! +10 XP', 'correct');
  } else {
    streak = 0;
    showFeedback('🤔 Try again!', 'incorrect');
  }
  
  updateUI();
  saveState({ done: currentQ + 1, streak });
  
  if (correct) {
    setTimeout(() => {
      currentQ++;
      showQuestion();
    }, 800);
  }
}

function showFeedback(msg, type) {
  const fb = document.getElementById('feedback');
  fb.textContent = msg;
  fb.className = 'feedback ' + type + ' show';
  setTimeout(() => fb.classList.remove('show'), 1500);
}

function showComplete() {
  document.getElementById('game-card').style.display = 'none';
  document.getElementById('complete-screen').style.display = 'block';
  document.getElementById('complete-score').textContent = 'You earned ' + score + ' XP!';
  showProgress();
}

// Init
updateUI();
showQuestion();
</script>

</body>
</html>
