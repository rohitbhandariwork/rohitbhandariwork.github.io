/* Brand Type Scale */
:root {

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Manrope',-apple-system,system-ui,sans-serif;background:#f8fafc;color:#1e293b;min-height:100vh;padding-top:52px;-webkit-font-smoothing:antialiased}
#topbar{position:fixed;top:0;left:0;right:0;height:52px;z-index:10000;background:rgba(255,255,255,0.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(0,0,0,.06);display:flex;align-items:center;gap:4px;padding:0 12px}
.hamburger{display:none;background:none;border:none;cursor:pointer;font-size:22px;color:#64748b;padding:6px 10px;border-radius:8px;transition:.2s}
.hamburger:hover{color:#1e293b;background:rgba(30,41,59,.06)}
.nav-links{display:flex;align-items:center;gap:4px;flex:1;justify-content:flex-end}
.nav-links a{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;color:#64748b;text-decoration:none;transition:.2s;white-space:nowrap}
.nav-links a:hover,.nav-links a.active{color:#1e293b;background:rgba(30,41,59,.06)}
.nav-dropdown{position:relative}
.nav-dropdown-menu{display:none;position:absolute;top:100%;left:0;background:#fff;border-radius:12px;box-shadow:0 10px 15px rgba(0,0,0,.1),0 4px 6px rgba(0,0,0,.05);padding:6px;min-width:140px;z-index:10001}
.nav-dropdown:hover .nav-dropdown-menu,.nav-dropdown.open .nav-dropdown-menu{display:block}
.nav-dropdown-menu a{display:block;padding:8px 14px;border-radius:8px;font-size:13px;white-space:nowrap;color:#334155;transition:.15s}
.nav-dropdown-menu a:hover{background:#f1f5f9;color:#1e293b}
@media(max-width:768px){
  .hamburger{display:block}
  .nav-links{display:none;position:fixed;top:52px;left:0;right:0;flex-direction:column;background:rgba(255,255,255,0.98);backdrop-filter:blur(12px);border-bottom:1px solid rgba(0,0,0,.06);padding:6px 12px 12px;gap:4px;align-items:stretch;box-shadow:0 10px 15px rgba(0,0,0,.1)}
  .nav-links.open{display:flex}
  .nav-links a{padding:10px 14px;border-radius:10px;font-size:14px;justify-content:center}
  .nav-dropdown-menu{position:static;box-shadow:none;background:#f1f5f9;border-radius:10px;margin-top:4px;display:none}
  .nav-dropdown.open .nav-dropdown-menu{display:block}
  .nav-dropdown-menu a{padding:10px 14px;font-size:14px}
}
.main{max-width:600px;margin:0 auto;padding:48px 16px 40px;text-align:center}
.hero-card{background:#fff;border:2px solid #fde68a;border-radius:24px;padding:40px 24px;margin-bottom:24px}

.hero p{font-size:15px;color:#64748b;margin-top:10px;line-height:1.6}
.cta-btn{display:inline-block;margin-top:20px;padding:12px 28px;background:linear-gradient(135deg, #f59e0b, #ef4444);color:#fff;text-decoration:none;border-radius:999px;font-size:14px;font-weight:700;transition:.2s}
.cta-btn:active{transform:scale(.96)}
.footer{margin-top:40px}
.footer a{color:#f59e0b;text-decoration:none;font-size:12px;font-weight:600;padding:8px 16px;border-radius:999px;transition:.2s}
