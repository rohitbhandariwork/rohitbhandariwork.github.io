<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Pomoflow</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="hero">
    <div class="hero-emoji">⏱️</div>
    <h1>Pomoflow</h1>
    <p>Incremental focus timer. Stay in the zone, beat the demons.</p>
  </div>

  <div class="section">
    <div class="timer-display">
      <div class="timer-circle">
        <svg viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="54" fill="none" stroke="#e5e7eb" stroke-width="8"/>
          <circle cx="60" cy="60" r="54" fill="none" stroke="var(--primary)" stroke-width="8" stroke-dasharray="339.292" stroke-dashoffset="84.823" stroke-linecap="round" transform="rotate(-90 60 60)"/>
        </svg>
        <div class="timer-text">25:00</div>
      </div>
    </div>

    <div class="timer-controls">
      <ion-button fill="outline">Reset</ion-button>
      <ion-button class="brand-primary" style="--background: linear-gradient(135deg, var(--primary), var(--secondary));">Start</ion-button>
    </div>

    <div class="timer-stats">
      <div class="stat">
        <div class="stat-value">0</div>
        <div class="stat-label">Sessions Today</div>
      </div>
      <div class="stat">
        <div class="stat-value">0</div>
        <div class="stat-label">XP Earned</div>
      </div>
      <div class="stat">
        <div class="stat-value">Lv.1</div>
        <div class="stat-label">Level</div>
      </div>
    </div>
  </div>

  <div class="page-footer">
    <ion-button fill="clear" routerLink="/home">← Back to Home</ion-button>
  </div>
</ion-content>
