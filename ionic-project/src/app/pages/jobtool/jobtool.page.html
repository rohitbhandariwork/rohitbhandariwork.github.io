<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Job Tool</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="hero">
    <div class="hero-emoji">💼</div>
    <h1>Job Tool</h1>
    <p>Find and apply for jobs. Track your applications.</p>
  </div>

  <div class="section">
    <div class="section-label">Quick Actions</div>
    <div class="focus-list">
      <div class="focus-item"><span class="icon">🔍</span><span class="label">Search Jobs</span></div>
      <div class="focus-item"><span class="icon">📝</span><span class="label">Generate Resume</span></div>
      <div class="focus-item"><span class="icon">📧</span><span class="label">Write Cover Letter</span></div>
      <div class="focus-item"><span class="icon">📊</span><span class="label">Track Applications</span></div>
    </div>
  </div>

  <div class="btn-group">
    <ion-button fill="outline" routerLink="/home">← Back</ion-button>
    <ion-button class="brand-primary" style="--background: linear-gradient(135deg, var(--primary), var(--secondary));">Start Job Hunt →</ion-button>
  </div>
</ion-content>
