<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Interview Prep</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="hero">
    <div class="hero-emoji">🎯</div>
    <h1>Interview Prep</h1>
    <p>AI-powered mock interviews. Practice and improve.</p>
  </div>

  <div class="section">
    <div class="section-label">Start a Mock Interview</div>
    <div class="focus-list">
      <div class="focus-item"><span class="icon">💻</span><span class="label">Technical — Data Structures & Algorithms</span></div>
      <div class="focus-item"><span class="icon">🏗️</span><span class="label">System Design</span></div>
      <div class="focus-item"><span class="icon">💼</span><span class="label">Behavioral — STAR Method</span></div>
      <div class="focus-item"><span class="icon">🧠</span><span class="label">AI/ML Specific</span></div>
    </div>
  </div>

  <div class="btn-group">
    <ion-button fill="outline" routerLink="/home">← Back</ion-button>
    <ion-button class="brand-primary" style="--background: linear-gradient(135deg, var(--primary), var(--secondary));">Start Interview →</ion-button>
  </div>
</ion-content>
