<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Shop</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="hero">
    <div class="hero-emoji">🛒</div>
    <h1>Shop</h1>
    <p>E-books, courses, and learning materials.</p>
  </div>

  <div class="section">
    <div class="section-label">Products</div>
    <div class="product-card">
      <div class="product-icon">📘</div>
      <div class="product-info">
        <div class="product-title">AI Fundamentals</div>
        <div class="product-price">₹299</div>
        <div class="product-desc">Complete guide to artificial intelligence for beginners.</div>
      </div>
      <ion-button fill="outline" size="small">Buy</ion-button>
    </div>
  </div>

  <div class="page-footer">
    <ion-button fill="clear" routerLink="/home">← Back to Home</ion-button>
  </div>
</ion-content>
