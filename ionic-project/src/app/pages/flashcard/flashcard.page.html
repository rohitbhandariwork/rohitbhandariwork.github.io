<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Flashcards</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="hero">
    <div class="hero-emoji">🃏</div>
    <h1>Flashcards</h1>
    <p>Spaced repetition learning. Master any topic with smart review.</p>
  </div>

  <div class="section">
    <div class="section-label">Your Decks</div>
    <div class="deck-card">
      <div class="deck-icon">🐍</div>
      <div class="deck-info">
        <div class="deck-title">Python Basics</div>
        <div class="deck-count">48 cards</div>
      </div>
      <div class="deck-progress">
        <div class="progress-bar"><div class="progress-fill" style="width: 65%"></div></div>
        <span>65%</span>
      </div>
    </div>

    <div class="deck-card">
      <div class="deck-icon">🧠</div>
      <div class="deck-info">
        <div class="deck-title">AI Concepts</div>
        <div class="deck-count">36 cards</div>
      </div>
      <div class="deck-progress">
        <div class="progress-bar"><div class="progress-fill" style="width: 30%"></div></div>
        <span>30%</span>
      </div>
    </div>

    <div class="deck-card">
      <div class="deck-icon">📐</div>
      <div class="deck-info">
        <div class="deck-title">Linear Algebra</div>
        <div class="deck-count">52 cards</div>
      </div>
      <div class="deck-progress">
        <div class="progress-bar"><div class="progress-fill" style="width: 10%"></div></div>
        <span>10%</span>
      </div>
    </div>
  </div>

  <div class="page-footer">
    <ion-button fill="clear" routerLink="/home">← Back to Home</ion-button>
  </div>
</ion-content>
